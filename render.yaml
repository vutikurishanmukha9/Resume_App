# Render deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: resume-analyzer
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
    autoDeploy: true
    plan: free
